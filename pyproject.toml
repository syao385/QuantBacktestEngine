[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtest-engine"
version = "0.1.0"
description = "A standalone, high-performance backtesting, optimization, risk management, and strategy versioning platform."
readme = "README.md"
authors = [
    { name = "Quant Trading Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "backtesting>=0.3.3",
    "optuna>=3.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "yfinance>=0.2.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
quant-engine = "quant_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_engine*"]
