name: "GEX_Momentum_Breakout"
version: "1.2.0"
author: "Quant Team"
description: "Declarative GEX momentum breakout strategy spec with ATR Risk Sizing and multi-stage trailing stops."
data:
  symbol: "SPY"
  timeframe: "1d"
indicators:
  ema_fast: { type: "EMA", period: 10 }
  ema_slow: { type: "EMA", period: 30 }
  atr: { type: "ATR", period: 14 }
position_sizing:
  type: "atr_risk"
  risk_pct: 0.015               # Risk 1.5% account equity per trade
  drawdown_scaling: true        # Throttle risk by 50% if drawdown > 10%
trailing_stop:
  type: "chandelier_ratchet"
  atr_multiplier: 3.0
  breakeven_trigger_r: 1.0       # Move stop to BE at +1.0R
  profit_lock_tiers:
    - { r_multiple: 2.0, atr_multiplier: 2.0 }
    - { r_multiple: 3.0, atr_multiplier: 1.5 }
rules:
  entry_long: "ema_fast > ema_slow"
